
name: Deploy CROSS BENCH to MilesWeb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crossbench-production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Verify Build Output
        run: test -s dist/index.html

      - name: Deploy to MilesWeb
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.MILESWEB_HOST }}
          username: ${{ secrets.MILESWEB_USERNAME }}
          key: ${{ secrets.MILESWEB_SSH_KEY }}
          passphrase: ${{ secrets.MILESWEB_SSH_PASSPHRASE }}
          port: ${{ secrets.MILESWEB_SSH_PORT }}
          source: "dist/*"
          target: ${{ secrets.MILESWEB_DEPLOY_PATH }}
          overwrite: true
          timeout: 60s
          command_timeout: 10m
